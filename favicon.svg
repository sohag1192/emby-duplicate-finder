<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="embyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="50%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Dark rounded background -->
    <rect width="64" height="64" rx="16" fill="#0b101a" />
    <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#embyGrad)" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Media Play / Duplicate emblem -->
    <g filter="url(#glow)">
        <!-- Back duplicate shadow card -->
        <polygon points="36,18 48,25 48,39 36,46 24,39 24,25" fill="#38bdf8" opacity="0.35" />
        <!-- Front primary card -->
        <polygon points="32,16 46,24 46,40 32,48 18,40 18,24" fill="url(#embyGrad)" />
        <!-- Inner play triangle -->
        <polygon points="28,26 38,32 28,38" fill="#ffffff" />
    </g>
</svg>
